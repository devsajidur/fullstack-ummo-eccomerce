<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UOMO International Fashion & Lifestyle Storefront — Shop curated women's, men's, beauty, and luxury essentials with fast worldwide delivery, verified promo coupons, and secure checkout."
    />
    <meta name="theme-color" content="#111827" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="UOMO — Modern Fashion & Lifestyle Ecommerce Storefront"
    />
    <meta
      property="og:description"
      content="Explore curated collections, flash deals, custom product notes, and secure checkout at UOMO."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/wxjt7d8q/image/upload/f_auto,q_auto,w_1200/ummo_banners/SLIDER"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=optional"
      />
    </noscript>
    <script>
      (function () {
        try {
          var p = window.location.pathname || "/";
          var base = "https://res.cloudinary.com/wxjt7d8q/image/upload/f_auto,q_auto,";
          var urls = [];
          if (p === "/" || p === "/index.html") {
            urls.push(base + "w_720,c_limit/ummo_banners/SLIDER");
            urls.push(base + "w_480,c_limit/ummo_banners/category1");
          } else if (p === "/shop") {
            urls.push(base + "w_960,c_limit/ummo_banners/shopBanner");
          } else if (p === "/discounts") {
            urls.push(base + "w_280,c_limit/ummo_products/product_6");
            urls.push(base + "w_280,c_limit/ummo_products/product_190");
          } else if (p.indexOf("/shop/") === 0) {
            var id = p.split("/")[2];
            if (id && /^\d+$/.test(id)) {
              urls.push(base + "w_420,c_limit/ummo_products/product_" + id);
            }
          }
          for (var i = 0; i < urls.length; i++) {
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = urls[i];
            link.setAttribute("fetchpriority", "high");
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UOMO Ecommerce",
        "url": "https://ummo-ecommerce.vercel.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ummo-ecommerce.vercel.app/shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <title>UOMO — International Fashion &amp; Lifestyle Storefront</title>
  </head>
  <body class="font-jost">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
